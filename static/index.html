<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<title>Civit-RV</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="header-row">
    <input id="q" type="search" placeholder="Search path/filename…">
    <select id="kind"><option value="all">All</option><option value="image">Images</option><option value="video">Videos</option></select>
    <select id="sort"><option value="name">Name</option><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="size">Largest</option></select>
    <button id="folder" title="Change folder">📁 Folder</button>
    <button id="rescan">Rescan</button>
  </div>
  <div class="header-row">
    <label class="chk"><input type="checkbox" id="rand"> Random</label>
    <label id="autolbl" class="chk"><input type="checkbox" id="auto"> Auto-scroll</label>
    <input type="range" id="speed" min="0" max="100" value="50" title="Auto-scroll speed">
    <span id="count"></span>
  </div>
</header>
<div id="wrap"><div id="grid"></div></div>
<div id="sentinel"></div>
<div id="status"></div>
<div id="lb"><div id="lbbar"><button id="backbtn">← Back</button><button id="delbtn">Delete</button><button id="mvbtn">Move</button></div><div id="lbmedia"></div><div id="lbinfo"></div></div>
<div id="toast"></div>
<div id="mv"><div id="mvhead"><b id="mvtitle">Move to folder</b><button id="mvclose" class="fbtn" style="padding:6px 12px">Cancel</button></div><div id="mvcrumbs"></div><button id="mvhere" class="fbtn here"></button><div id="mvgrid"></div></div>
<div id="confirm" class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ctitle"><div id="cstack"></div><h3 id="ctitle"></h3><p id="cbody">They'll be deleted for good. This can't be undone.</p><div class="cbtns"><button id="ccancel">Cancel</button><button id="cok">Delete</button></div></div></div>
<script src="/static/app.js"></script>
<script src="/static/select.js"></script>
</body>
</html>
