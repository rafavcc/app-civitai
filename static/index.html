<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<title>Civit-RV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #1a1b1e; color: #c1c2c5; font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-touch-callout: none; }


  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  header { position: sticky; top: 0; z-index: 10; display: flex; flex-direction: column; gap: 6px;
           padding: 8px 16px; background: #141517; border-bottom: 1px solid #2c2e33; }
  .header-row { display: flex; gap: 8px; align-items: center; }
  header input[type=search], header select, header button { background: #25262b; color: inherit; border: 1px solid #373a40;
           border-radius: 6px; padding: 6px 10px; font-size: 14px; }
  header input[type=search] { flex: 1; min-width: 0; }
  header input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: #4dabf7; }
  header input[type=range] { width: 90px; margin: 0; accent-color: #4dabf7; }
  .chk { font-size: 13px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  #count { margin-left: auto; font-size: 13px; opacity: .7; white-space: nowrap; }
  :root { --gap: 8px; --pad: 16px; --cols: 4; }
  @media (max-width: 700px) { :root { --gap: 2px; --pad: 2px; } header { padding: 6px 8px; } header select, header button { padding: 6px 8px; } }
  #wrap { container-type: inline-size; }
  #grid { display: grid; gap: var(--gap); padding: 12px var(--pad); grid-template-columns: repeat(var(--cols), 1fr);
          grid-auto-flow: row dense;
          grid-auto-rows: calc((100cqw - 2 * var(--pad) - (var(--cols) - 1) * var(--gap)) / var(--cols) * 4 / 3); }
  .tile.wide { grid-column: span 2; }
  .tile { position: relative; background: #25262b; border-radius: 8px; overflow: hidden; cursor: pointer; }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile:hover { outline: 2px solid #4dabf7; }
  .label { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 8px 6px; font-size: 11px;
           background: linear-gradient(transparent, rgba(0,0,0,.75)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; }
  .tile:hover .label { opacity: 1; }
  #sentinel { height: 1px; }
  #status { text-align: center; padding: 20px; opacity: .6; }
  #lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 20; align-items: center; justify-content: center; flex-direction: column; }
  #lb.open { display: flex; }
  #lb img, #lb video { max-width: 96vw; max-height: 80vh; }
  #lbbar { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
  #lbinfo { margin-top: 8px; font-size: 13px; max-width: 96vw; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lbbar button { background: #25262b; color: inherit; border: 1px solid #373a40; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; flex: none; }
  #mv { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; z-index: 30; flex-direction: column; padding: 16px; overflow-y: auto; }
  #mv.open { display: flex; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #c92a2a; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 40; display: none; }
  #mvhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #mvgrid { display: grid; gap: 8px; grid-template-columns: repeat(5, 1fr); }
  .fbtn { background: #25262b; color: inherit; border: 1px solid #373a40; border-radius: 8px; padding: 18px 4px; font-size: 14px; cursor: pointer; word-break: break-word; }
  .fbtn:hover { outline: 2px solid #4dabf7; }
  .fbtn.cur { opacity: .5; }
  .fbtn.red { background: #5c1a1a; border-color: #c92a2a; color: #ffa8a8; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <input id="q" type="search" placeholder="Search path/filename…">
    <select id="kind"><option value="all">All</option><option value="image">Images</option><option value="video">Videos</option></select>
    <select id="sort"><option value="name">Name</option><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="size">Largest</option></select>
    <button id="folder" title="Change folder">📁 Folder</button>
    <button id="rescan">Rescan</button>
  </div>
  <div class="header-row">
    <label class="chk"><input type="checkbox" id="rand"> Random</label>
    <label id="autolbl" class="chk"><input type="checkbox" id="auto"> Auto-scroll</label>
    <input type="range" id="speed" min="0" max="100" value="50" title="Auto-scroll speed">
    <span id="count"></span>
  </div>
</header>
<div id="wrap"><div id="grid"></div></div>
<div id="sentinel"></div>
<div id="status"></div>
<div id="lb"><div id="lbbar"><button id="backbtn">← Back</button><button id="delbtn">Delete</button><button id="mvbtn">Move</button></div><div id="lbmedia"></div><div id="lbinfo"></div></div>
<div id="toast"></div>
<div id="mv"><div id="mvhead"><b id="mvtitle">Move to folder</b><button id="mvclose" class="fbtn" style="padding:6px 12px">Cancel</button></div><div id="mvgrid"></div></div>
<script>
const PAGE = 40;
const $ = id => document.getElementById(id);
let seed = Math.random().toString(36).slice(2), ver = 0;
let offset = 0, total = 0, loading = false, done = false, gen = 0, listed = [];

async function loadMore() {
  if (loading || done) return;
  loading = true;
  const g = gen;
  const p = new URLSearchParams({ offset, limit: PAGE, sort: $('rand').checked ? 'random' : $('sort').value, seed, kind: $('kind').value, q: $('q').value });
  let r;
  try {
    r = await (await fetch('/api/items?' + p)).json();
  } catch (e) {
    loading = false;
    setTimeout(loadMore, 1000);
    return;
  }
  if (g !== gen) { loading = false; return; }
  total = r.total;
  ver = r.ver;
  for (const it of r.items) { listed.push(it); $('grid').appendChild(tile(it, listed.length - 1)); }
  offset += r.items.length;
  done = offset >= total;
  $('count').textContent = `${offset} / ${total}`;
  $('status').textContent = total === 0 ? 'No files found.' : done ? 'End.' : '';
  loading = false;
  if (!done && $('sentinel').getBoundingClientRect().top < innerHeight + 600) loadMore();
}

// Only videos near the viewport hold a source, so they don't exhaust the browser's connection limit
const playObs = new IntersectionObserver(es => {
  for (const e of es) {
    const v = e.target;
    if (e.isIntersecting) {
      if (!v.getAttribute('src')) v.src = v.dataset.src;
      v.play().catch(() => {});
    } else {
      v.pause();
      if (v.getAttribute('src')) { v.removeAttribute('src'); v.load(); }
    }
  }
}, { rootMargin: '300px' });

function markWide(d, w, h) {
  if (w && h && w / h > 1.15) d.classList.add('wide');
}

function tile(it, index) {
  const d = document.createElement('div');
  d.className = 'tile';
  const src = '/media/' + it.id + '?v=' + ver;
  if (it.kind === 'image') {
    d.innerHTML = `<img loading="lazy" decoding="async" src="${src}" width="${it.width || '600'}" height="${it.height || '450'}">`;
    const im = d.firstChild;
    im.onload = () => markWide(d, im.naturalWidth, im.naturalHeight);
  } else {
    d.innerHTML = `<video muted loop playsinline preload="metadata" data-src="${src}#t=0.1"></video>`;
    const v = d.firstChild;
    v.autoplay = true;
    v.onloadedmetadata = () => markWide(d, v.videoWidth, v.videoHeight);
    playObs.observe(v);
  }
  const l = document.createElement('div');
  l.className = 'label';
  l.textContent = it.path;
  d.appendChild(l);
  d.onclick = () => openLb(index);
  it.el = d;
  return d;
}

function reset() {
  gen++;
  seed = Math.random().toString(36).slice(2);
  closeLb();
  for (const v of $('grid').querySelectorAll('video')) { v.removeAttribute('src'); v.load(); }
  playObs.disconnect(); offset = 0; done = false; loading = false; listed = [];
  $('grid').innerHTML = '';
  scrollTo(0, 0);
  loadMore();
}

new IntersectionObserver(es => { if (es[0].isIntersecting) loadMore(); }, { rootMargin: '800px' }).observe($('sentinel'));

let t;
$('q').oninput = () => { clearTimeout(t); t = setTimeout(reset, 250); };
$('kind').onchange = $('sort').onchange = $('rand').onchange = reset;
fetch('/api/info').then(r => r.json()).then(r => { document.title = 'Civit-RV - ' + r.folder.split('/').pop(); });
$('rescan').onclick = async () => { await fetch('/api/rescan'); reset(); };

let cur = -1;
function openLb(i, dir = 1) {
  const it = listed[i];
  if (!it) return;
  if (it.moved) {
    const n = i + dir;
    return n >= 0 && n < listed.length ? openLb(n, dir) : closeLb();
  }
  cur = i;
  const src = '/media/' + it.id + '?v=' + ver;
  $('lbmedia').innerHTML = it.kind === 'image' ? `<img src="${src}">` : `<video src="${src}" controls autoplay loop></video>`;
  $('lbinfo').textContent = `${it.path} · ${(it.size / 1048576).toFixed(2)} MB · ${new Date(it.mtime * 1000).toLocaleString()}`;
  $('lb').classList.add('open');
  if (i >= listed.length - 3) loadMore();
}
function closeLb() { $('lb').classList.remove('open'); $('lbmedia').innerHTML = ''; cur = -1; }
$('backbtn').onclick = closeLb;
$('lb').onclick = e => { if (e.target === $('lb')) closeLb(); };
addEventListener('keydown', e => {
  if (cur < 0) return;
  if ($('mv').classList.contains('open')) { if (e.key === 'Escape') closeMv(); return; }
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') openLb(Math.min(cur + 1, listed.length - 1), 1);
  if (e.key === 'ArrowLeft') openLb(Math.max(cur - 1, 0), -1);
});

const RED = new Set(['hen', 'ai', 'big', 'nn', 'hot']);
function dropItem(it) {
  it.moved = true;
  it.el.remove();
  offset--; total--;
  $('count').textContent = `${offset} / ${total}`;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 3000);
}

// Shared folder-grid overlay used by both Move and the Folder button
async function pickFolder(title, onPick) {
  let r;
  try { r = await (await fetch('/api/folders')).json(); } catch (e) { return toast('Could not load folders'); }
  $('mvtitle').textContent = title;
  const grid = $('mvgrid');
  grid.innerHTML = '';
  for (const name of r.folders) {
    const b = document.createElement('button');
    b.className = 'fbtn' + (name === r.current ? ' cur' : '') + (RED.has(name.toLowerCase()) ? ' red' : '');
    b.textContent = name === r.current ? name + ' (current)' : name;
    b.onclick = () => onPick(name);
    grid.appendChild(b);
  }
  $('mv').classList.add('open');
}

$('folder').onclick = () => pickFolder('Open folder', async name => {
  const res = await (await fetch('/api/folder?name=' + encodeURIComponent(name))).json();
  if (res.error) return toast(res.error);
  closeMv();
  document.title = 'Civit-RV - ' + name;
  reset();
});

$('delbtn').onclick = async () => {
  const it = listed[cur];
  if (!it) return;
  const res = await (await fetch('/api/delete?id=' + it.id, { method: 'POST' })).json();
  if (res.error) return toast(res.error);
  closeLb();
  dropItem(it);
};

function closeMv() { $('mv').classList.remove('open'); }
$('mvclose').onclick = closeMv;
$('mvbtn').onclick = () => {
  const it = listed[cur];
  if (!it) return;
  pickFolder('Move to folder', async name => {
    const res = await (await fetch('/api/move?' + new URLSearchParams({ id: it.id, dest: name }), { method: 'POST' })).json();
    if (res.error) return toast(res.error);
    closeMv();
    closeLb();
    if (res.moved) dropItem(it);
  });
};

// Auto-scroll: seconds per grid row set by the speed slider (20s left, 10s middle, 2s right)
function rowSeconds() {
  const v = +$('speed').value;
  return v <= 50 ? 20 - v / 5 : 10 - (v - 50) * 0.16;
}
let autoPos = 0, autoLast = 0;
function autoStep(now) {
  if (!$('auto').checked) return;
  requestAnimationFrame(autoStep);
  const dt = Math.min(now - autoLast, 100) / 1000;
  autoLast = now;
  if (cur >= 0 || $('mv').classList.contains('open')) { autoPos = scrollY; return; }
  // Re-sync when the user scrolled manually or the page was reset
  if (Math.abs(scrollY - autoPos) > 2) autoPos = scrollY;
  const tile = $('grid').firstElementChild;
  if (!tile) return;
  const row = tile.offsetHeight + parseFloat(getComputedStyle($('grid')).rowGap || 0);
  autoPos += row / rowSeconds() * dt;
  scrollTo(0, autoPos);
}
$('auto').onchange = () => {
  if ($('auto').checked) { autoPos = scrollY; autoLast = performance.now(); requestAnimationFrame(autoStep); }
};

loadMore();
</script>
</body>
</html>
